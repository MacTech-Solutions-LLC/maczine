name: Render field copies

# Every article merged to main gets its press-room "field copy" PDF
# generated and committed next to it (articles/<slug>/field-copy.pdf).
# The bot commit touches only *.pdf, which is outside the paths filter,
# so it can never retrigger this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'articles/**/index.md'
      - 'scripts/build-article.mjs'
      - 'scripts/render-pdf.mjs'
  workflow_dispatch:

permissions:
  contents: write

# Merging a batch (a week of issues, or ten at once) fires one run per
# merge, and every run ends by committing PDFs to main. Left unserialized
# they race: the first to push wins and the rest die on a rejected
# non-fast-forward. That is only survivable because the job renders --all,
# so whichever run finishes last happens to carry every article - if the
# LAST one is the one that loses the race, field copies go missing on main
# with nothing but a red check to say so.
#
# Serializing on the branch fixes it properly. cancel-in-progress drops
# runs that a newer push has already superseded, because --all makes each
# run a complete replacement for every earlier one rather than an
# increment on top of it. Eleven merges become one render instead of
# eleven, which also keeps this off the Actions minute budget.
concurrency:
  group: field-copies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/build-article.mjs --all --pdf
      - name: Commit field copies
        run: |
          git add articles/*/field-copy.pdf
          if git diff --cached --quiet; then
            echo "field copies unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: render field copies"

          # The concurrency group above keeps our own runs off each other,
          # but a human merge can still land between our checkout and our
          # push. Rebase onto whatever arrived and try again rather than
          # failing the run. On a PDF conflict take -X theirs: in a rebase
          # "theirs" is the commit being replayed, i.e. the copies this run
          # just rendered, while files added upstream survive untouched.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "field copies pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/main (attempt ${attempt})"
            git fetch --quiet origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::field copies could not be rebased onto origin/main"
              exit 1
            fi
            sleep $(( attempt * 5 ))
          done
          echo "::error::field copies still unpushed after 5 attempts"
          exit 1
